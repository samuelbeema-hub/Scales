<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chordzilla - Ultimate Music Scale Finder</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:'Poppins',sans-serif;

  background:

  linear-gradient(
    rgba(5,5,15,0.78),
    rgba(5,5,15,0.88)
  ),

  url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=1974&auto=format&fit=crop');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;

  overflow-x:hidden;
  position:relative;
}

/* Floating Music Elements */

body::before{
  content:"♫ ♪ ♬ ♩ ♫ ♪";

  position:fixed;
  top:5%;
  left:5%;

  font-size:90px;

  color:rgba(255,255,255,0.06);

  transform:rotate(-15deg);

  animation:floatMusic 8s ease-in-out infinite;
}

body::after{
  content:"🎸 🎹 🎵";

  position:fixed;
  bottom:5%;
  right:5%;

  font-size:70px;

  opacity:0.12;

  animation:floatMusic2 10s ease-in-out infinite;
}

@keyframes floatMusic{

  0%{
    transform:translateY(0px) rotate(-15deg);
  }

  50%{
    transform:translateY(-20px) rotate(-10deg);
  }

  100%{
    transform:translateY(0px) rotate(-15deg);
  }
}

@keyframes floatMusic2{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-15px);
  }

  100%{
    transform:translateY(0px);
  }
}

.app{
  width:100%;
  max-width:950px;

  background:rgba(10,10,20,0.72);

  border:1px solid rgba(255,255,255,0.12);

  backdrop-filter:blur(18px);

  border-radius:30px;

  padding:30px;

  box-shadow:
  0 0 50px rgba(0,229,255,0.15),
  0 0 100px rgba(255,0,128,0.10);

  z-index:2;
}

.logo{
  text-align:center;
  font-size:52px;
  margin-bottom:10px;
}

h1{
  text-align:center;
  font-size:42px;
  margin-bottom:10px;

  background:linear-gradient(
    90deg,
    #00e5ff,
    #ff4fd8,
    #ffd600
  );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  text-align:center;
  color:#d0d0d0;
  margin-bottom:28px;
  font-size:17px;
}

.search-box{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

input{
  flex:1;
  min-width:230px;
  padding:16px;
  border:none;
  border-radius:16px;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.12);
  color:white;
}

input::placeholder{
  color:#d0d0d0;
}

button{
  padding:16px 24px;
  border:none;
  border-radius:16px;

  background:linear-gradient(
    135deg,
    #00e5ff,
    #ff4fd8
  );

  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.25s;
}

button:hover{
  transform:translateY(-3px) scale(1.03);
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:22px;
  gap:10px;
  flex-wrap:wrap;
}

.badge{
  padding:10px 18px;
  border-radius:50px;

  background:linear-gradient(
    135deg,
    #ffd600,
    #ff4fd8
  );

  color:black;
  font-weight:700;
}

.section{
  margin-top:28px;
}

.section h2{
  margin-bottom:16px;
  font-size:24px;
  color:#00e5ff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:14px;
}

.card{
  background:rgba(255,255,255,0.10);
  padding:16px;
  border-radius:18px;
  text-align:center;
  font-weight:600;
  transition:0.25s;
}

.card:hover{
  transform:translateY(-5px) scale(1.04);

  background:linear-gradient(
    135deg,
    rgba(0,229,255,0.25),
    rgba(255,79,216,0.25)
  );
}

.info{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.info-card{
  background:rgba(255,255,255,0.08);
  padding:18px;
  border-radius:18px;
}

.info-card span{
  color:#ffd600;
  font-weight:700;
}

.error{
  margin-top:25px;
  background:rgba(255,0,0,0.18);
  padding:18px;
  border-radius:18px;
  text-align:center;
  font-weight:600;
}

.footer{
  text-align:center;
  margin-top:35px;
  color:#d0d0d0;
  font-size:14px;
}

.footer span{
  color:#ff4fd8;
  font-weight:600;
}

@media(max-width:768px){

  h1{
    font-size:32px;
  }

  .logo{
    font-size:42px;
  }

  .search-box{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}

</style>
</head>

<body>

<div class="app">

<div class="logo">🎸🔥</div>

<h1>Chordzilla</h1>

<p class="subtitle">
Ultimate Major • Minor • Pentatonic • Sharp • Flat Scale Finder
</p>

<div class="search-box">

<input
type="text"
id="scaleInput"
placeholder="Try: F# major, Bb minor, Gb minor"
/>

<button onclick="showScale()">
🎵 Find Scale
</button>

</div>

<div class="top-bar">

<div class="badge" id="scaleType">
READY
</div>

<button onclick="randomScale()">
🎲 Random Scale
</button>

</div>

<div id="result"></div>

<div class="footer">
<span>Chordzilla</span> • Built for Musicians 🎶
</div>

</div>

<script>

function normalize(text){
  return text
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace("♯","#")
    .replace("♭","b");
}

const scales = {

},

},

"aminor":{

},

"a#major":{

},

"bmajor":{

relative:"G# minor",
mood:"Strong"
},

"bminor":{
notes:["B","C#","D","E","F#","G","A"],
chords:["Bm","C#dim","D","Em","F#m","G","A"],
pentatonic:["B","D","E","F#","A"],
relative:"D major",
mood:"Reflective"
},

"bbmajor":{
notes:["Bb","C","D","Eb","F","G","A"],
chords:["Bb","Cm","Dm","Eb","F","Gm","Adim"],
pentatonic:["Bb","C","D","F","G"],
relative:"G minor",
mood:"Smooth"
},

"bbminor":{
notes:["Bb","C","Db","Eb","F","Gb","Ab"],
chords:["Bbm","Cdim","Db","Ebm","Fm","Gb","Ab"],

relative:"Db major",
mood:"Sad"
},

"cbmajor":{
notes:["Cb","Db","Eb","Fb","Gb","Ab","Bb"],
chords:["Cb","Dbm","Ebm","Fb","Gb","Abm","Bbdim"],

relative:"Ab minor",
mood:"Smooth / Calm"
},

"cbminor":{

chords:["Cbm","Dbdim","Ebb","Fbm","Gbm","Abb","Bbb"],
pentatonic:["Cb","Ebb","Fb","Gb","Bbb"],
relative:"Ebb major",
mood:"Dark"
},

"dbmajor":{
notes:["Db","Eb","F","Gb","Ab","Bb","C"],
chords:["Db","Ebm","Fm","Gb","Ab","Bbm","Cdim"],
pentatonic:["Db","Eb","F","Ab","Bb"],
relative:"Bb minor",
mood:"Calm"
},

"dbminor":{
notes:["Db","Eb","Fb","Gb","Ab","Bbb","Cb"],
chords:["Dbm","Ebdim","Fb","Gbm","Abm","Bbb","Cb"],
pentatonic:["Db","Fb","Gb","Ab","Cb"],
relative:"Fb major",
mood:"Atmospheric"
}

};

function createCards(arr){
  return arr.map(item=>`
  <div class="card">${item}</div>
  `).join("");
}

function showScale(){

const input=normalize(
document.getElementById("scaleInput").value
);

const result=document.getElementById("result");
const scaleType=document.getElementById("scaleType");

if(scales[input]){

const data=scales[input];

scaleType.innerHTML=`🎵 ${input.toUpperCase()}`;

result.innerHTML=`

<div class="info">

<div class="info-card">
<span>Relative Scale</span><br>
${data.relative}
</div>

<div class="info-card">
<span>Mood</span><br>
${data.mood}
</div>

</div>

<div class="section">
<h2>🎼 Scale Notes</h2>

<div class="grid">
${createCards(data.notes)}
</div>
</div>

<div class="section">
<h2>🎹 Chords in Scale</h2>

<div class="grid">
${createCards(data.chords)}
</div>
</div>

<div class="section">
<h2>🔥 Pentatonic Scale</h2>

<div class="grid">
${createCards(data.pentatonic)}
</div>
</div>

`;

}else{

scaleType.innerHTML="❌ NOT FOUND";

result.innerHTML=`
<div class="error">

Scale not found.<br><br>

Try:<br>
A# major<br>
Gb minor<br>
Cb major<br>
Fb minor

</div>
`;
}
}

function randomScale(){

const keys=Object.keys(scales);

const random=
keys[Math.floor(Math.random()*keys.length)];

document.getElementById("scaleInput").value=
random.replace("major"," major")
      .replace("minor"," minor");

showScale();
}

</script>

</body>
</html>
