<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Scale Hub - Scale & Chord Finder</title>

<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    min-height:100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
  }

  .app{
    width:100%;
    max-width:700px;
    background:rgba(0,0,0,0.35);
    border-radius:22px;
    padding:25px;
    backdrop-filter: blur(10px);
    box-shadow:0 15px 40px rgba(0,0,0,0.5);
  }

  h1{
    text-align:center;
    margin-bottom:10px;
    font-size:32px;
  }

  .subtitle{
    text-align:center;
    color:#cfd8dc;
    margin-bottom:25px;
  }

  .search-box{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  input{
    flex:1;
    min-width:220px;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    outline:none;
  }

  button{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:#1db954;
    color:black;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
  }

  button:hover{
    transform:translateY(-2px);
  }

  .section{
    margin-top:25px;
  }

  .section h2{
    margin-bottom:15px;
    color:#1db954;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
    gap:12px;
  }

  .card{
    background:rgba(255,255,255,0.12);
    padding:14px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    transition:0.2s;
  }

  .card:hover{
    transform:scale(1.04);
    background:rgba(255,255,255,0.18);
  }

  .error{
    background:#ff4d4d;
    padding:14px;
    border-radius:12px;
    margin-top:20px;
    text-align:center;
    font-weight:bold;
  }

  .top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    flex-wrap:wrap;
    gap:10px;
  }

  .badge{
    background:#1db954;
    color:black;
    padding:8px 14px;
    border-radius:50px;
    font-weight:bold;
  }

  .footer{
    text-align:center;
    margin-top:30px;
    color:#b0bec5;
    font-size:14px;
  }

</style>
</head>

<body>

<div class="app">

  <h1>🎸 Scale Hub</h1>
  <p class="subtitle">
    Find Major, Minor & Pentatonic Scale Chords Instantly
  </p>

  <div class="search-box">
    <input 
      type="text"
      id="scaleInput"
      placeholder="Example: E major, A minor, F# major"
    />

    <button onclick="showScale()">
      Show Scale
    </button>
  </div>

  <div class="top-bar">
    <div class="badge" id="scaleType">
      Ready
    </div>

    <button onclick="randomScale()">
      🎲 Random Scale
    </button>
  </div>

  <div id="result"></div>

  <div class="footer">
    Scale Hub • Built for Musicians 🎶
  </div>

</div>

<script>

function normalize(text){
  return text
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace("♯","#")
    .replace("♭","b");
}

const scales = {

  // ===== MAJOR =====

  "cmajor":{
    chords:["C","Dm","Em","F","G","Am","Bdim"],
    pentatonic:["C","D","E","G","A"],
    notes:["C","D","E","F","G","A","B"],
    mood:"Happy / Bright"
  },

  "dmajor":{
    chords:["D","Em","F#m","G","A","Bm","C#dim"],
    pentatonic:["D","E","F#","A","B"],
    notes:["D","E","F#","G","A","B","C#"],
    mood:"Powerful"
  },

  "emajor":{
    chords:["E","F#m","G#m","A","B","C#m","D#dim"],
    pentatonic:["E","F#","G#","B","C#"],
    notes:["E","F#","G#","A","B","C#","D#"],
    mood:"Energetic"
  },

  "fmajor":{
    chords:["F","Gm","Am","Bb","C","Dm","Edim"],
    pentatonic:["F","G","A","C","D"],
    notes:["F","G","A","Bb","C","D","E"],
    mood:"Warm"
  },

  "gmajor":{
    chords:["G","Am","Bm","C","D","Em","F#dim"],
    pentatonic:["G","A","B","D","E"],
    notes:["G","A","B","C","D","E","F#"],
    mood:"Uplifting"
  },

  "amajor":{
    chords:["A","Bm","C#m","D","E","F#m","G#dim"],
    pentatonic:["A","B","C#","E","F#"],
    notes:["A","B","C#","D","E","F#","G#"],
    mood:"Joyful"
  },

  "bmajor":{
    chords:["B","C#m","D#m","E","F#","G#m","A#dim"],
    pentatonic:["B","C#","D#","F#","G#"],
    notes:["B","C#","D#","E","F#","G#","A#"],
    mood:"Strong"
  },

  // ===== MINOR =====

  "aminor":{
    chords:["Am","Bdim","C","Dm","Em","F","G"],
    pentatonic:["A","C","D","E","G"],
    notes:["A","B","C","D","E","F","G"],
    mood:"Sad / Emotional"
  },

  "eminor":{
    chords:["Em","F#dim","G","Am","Bm","C","D"],
    pentatonic:["E","G","A","B","D"],
    notes:["E","F#","G","A","B","C","D"],
    mood:"Deep"
  },

  "dminor":{
    chords:["Dm","Edim","F","Gm","Am","Bb","C"],
    pentatonic:["D","F","G","A","C"],
    notes:["D","E","F","G","A","Bb","C"],
    mood:"Melancholic"
  },

  "gminor":{
    chords:["Gm","Adim","Bb","Cm","Dm","Eb","F"],
    pentatonic:["G","Bb","C","D","F"],
    notes:["G","A","Bb","C","D","Eb","F"],
    mood:"Dark"
  },

  "cminor":{
    chords:["Cm","Ddim","Eb","Fm","Gm","Ab","Bb"],
    pentatonic:["C","Eb","F","G","Bb"],
    notes:["C","D","Eb","F","G","Ab","Bb"],
    mood:"Cinematic"
  },

  "f#minor":{
    chords:["F#m","G#dim","A","Bm","C#m","D","E"],
    pentatonic:["F#","A","B","C#","E"],
    notes:["F#","G#","A","B","C#","D","E"],
    mood:"Modern"
  }
};

function createCards(arr){
  return arr.map(item => `
    <div class="card">${item}</div>
  `).join("");
}

function showScale(){

  const input = normalize(
    document.getElementById("scaleInput").value
  );

  const result = document.getElementById("result");
  const scaleType = document.getElementById("scaleType");

  if(scales[input]){

    const data = scales[input];

    scaleType.innerHTML = `🎵 ${input.toUpperCase()}`;

    result.innerHTML = `

      <div class="section">
        <h2>🎼 Scale Notes</h2>
        <div class="grid">
          ${createCards(data.notes)}
        </div>
      </div>

      <div class="section">
        <h2>🎹 Chords in Scale</h2>
        <div class="grid">
          ${createCards(data.chords)}
        </div>
      </div>

      <div class="section">
        <h2>🔥 Pentatonic Scale</h2>
        <div class="grid">
          ${createCards(data.pentatonic)}
        </div>
      </div>

      <div class="section">
        <h2>🎧 Mood</h2>
        <div class="card">
          ${data.mood}
        </div>
      </div>

    `;

  } else {

    scaleType.innerHTML = "❌ Not Found";

    result.innerHTML = `
      <div class="error">
        Scale not found. Try:
        <br><br>
        E major<br>
        A minor<br>
        G major
      </div>
    `;
  }
}

function randomScale(){

  const keys = Object.keys(scales);

  const random =
    keys[Math.floor(Math.random() * keys.length)];

  document.getElementById("scaleInput").value =
    random.replace("major"," major")
          .replace("minor"," minor");

  showScale();
}

</script>

</body>
</html>
