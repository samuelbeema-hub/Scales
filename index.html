<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scale Hub - Complete Music Scale Finder</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;
}

.app{
  width:100%;
  max-width:850px;
  background:rgba(0,0,0,0.35);
  border-radius:22px;
  padding:25px;
  backdrop-filter:blur(10px);
  box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

h1{
  text-align:center;
  margin-bottom:10px;
  font-size:34px;
}

.subtitle{
  text-align:center;
  color:#cfd8dc;
  margin-bottom:25px;
}

.search-box{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input{
  flex:1;
  min-width:220px;
  padding:14px;
  border:none;
  border-radius:12px;
  font-size:16px;
  outline:none;
}

button{
  padding:14px 20px;
  border:none;
  border-radius:12px;
  background:#1db954;
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:translateY(-2px);
}

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:20px;
  flex-wrap:wrap;
  gap:10px;
}

.badge{
  background:#1db954;
  color:black;
  padding:8px 14px;
  border-radius:50px;
  font-weight:bold;
}

.section{
  margin-top:25px;
}

.section h2{
  margin-bottom:15px;
  color:#1db954;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;
}

.card{
  background:rgba(255,255,255,0.12);
  padding:14px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  transition:0.2s;
}

.card:hover{
  transform:scale(1.05);
  background:rgba(255,255,255,0.18);
}

.error{
  background:#ff4d4d;
  padding:14px;
  border-radius:12px;
  margin-top:20px;
  text-align:center;
  font-weight:bold;
}

.footer{
  text-align:center;
  margin-top:30px;
  color:#b0bec5;
  font-size:14px;
}

.info{
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}

.info-card{
  background:rgba(255,255,255,0.1);
  padding:15px;
  border-radius:14px;
}

.info-card span{
  color:#1db954;
  font-weight:bold;
}

</style>
</head>

<body>

<div class="app">

<h1>🎸 Scale Hub</h1>

<p class="subtitle">
Complete Major, Minor & Pentatonic Scale Finder
</p>

<div class="search-box">

<input 
type="text"
id="scaleInput"
placeholder="Example: E major, Bb minor, F# major"
/>

<button onclick="showScale()">
Show Scale
</button>

</div>

<div class="top-bar">

<div class="badge" id="scaleType">
Ready
</div>

<button onclick="randomScale()">
🎲 Random Scale
</button>

</div>

<div id="result"></div>

<div class="footer">
Scale Hub • Built for Musicians 🎶
</div>

</div>

<script>

function normalize(text){
  return text
    .toLowerCase()
    .replace(/\s+/g,"")
    .replace("♯","#")
    .replace("♭","b");
}

const scales = {

"cmajor":{
notes:["C","D","E","F","G","A","B"],
chords:["C","Dm","Em","F","G","Am","Bdim"],
pentatonic:["C","D","E","G","A"],
relative:"A minor",
mood:"Happy / Bright"
},

"cminor":{
notes:["C","D","Eb","F","G","Ab","Bb"],
chords:["Cm","Ddim","Eb","Fm","Gm","Ab","Bb"],
pentatonic:["C","Eb","F","G","Bb"],
relative:"Eb major",
mood:"Dark / Emotional"
},

"c#major":{
notes:["C#","D#","E#","F#","G#","A#","B#"],
chords:["C#","D#m","E#m","F#","G#","A#m","B#dim"],
pentatonic:["C#","D#","F","G#","A#"],
relative:"A# minor",
mood:"Bright"
},

"c#minor":{
notes:["C#","D#","E","F#","G#","A","B"],
chords:["C#m","D#dim","E","F#m","G#m","A","B"],
pentatonic:["C#","E","F#","G#","B"],
relative:"E major",
mood:"Emotional"
},

"dmajor":{
notes:["D","E","F#","G","A","B","C#"],
chords:["D","Em","F#m","G","A","Bm","C#dim"],
pentatonic:["D","E","F#","A","B"],
relative:"B minor",
mood:"Powerful"
},

"dminor":{
notes:["D","E","F","G","A","Bb","C"],
chords:["Dm","Edim","F","Gm","Am","Bb","C"],
pentatonic:["D","F","G","A","C"],
relative:"F major",
mood:"Sad"
},

"d#major":{
notes:["D#","E#","F##","G#","A#","B#","C##"],
chords:["D#","E#m","F##m","G#","A#","B#m","C##dim"],
pentatonic:["D#","F","G","A#","C"],
relative:"C minor",
mood:"Strong"
},

"d#minor":{
notes:["D#","E#","F#","G#","A#","B","C#"],
chords:["D#m","E#dim","F#","G#m","A#m","B","C#"],
pentatonic:["D#","F#","G#","A#","C#"],
relative:"F# major",
mood:"Heavy"
},

"ebmajor":{
notes:["Eb","F","G","Ab","Bb","C","D"],
chords:["Eb","Fm","Gm","Ab","Bb","Cm","Ddim"],

relative:"C minor",
mood:"Soulful"
},

"ebminor":{
notes:["Eb","F","Gb","Ab","Bb","Cb","Db"],
chords:["Ebm","Fdim","Gb","Abm","Bbm","Cb","Db"],
pentatonic:["Eb","Gb","Ab","Bb","Db"],
relative:"Gb major",
mood:"Dark"
},

"emajor":{
notes:["E","F#","G#","A","B","C#","D#"],
chords:["E","F#m","G#m","A","B","C#m","D#dim"],
pentatonic:["E","F#","G#","B","C#"],
relative:"C# minor",
mood:"Energetic"
},

"eminor":{
notes:["E","F#","G","A","B","C","D"],
chords:["Em","F#dim","G","Am","Bm","C","D"],

mood:"Deep"
},

"fmajor":{
notes:["F","G","A","Bb","C","D","E"],
chords:["F","Gm","Am","Bb","C","Dm","Edim"],

relative:"D minor",
mood:"Warm"
},

"fminor":{
notes:["F","G","Ab","Bb","C","Db","Eb"],
chords:["Fm","Gdim","Ab","Bbm","Cm","Db","Eb"],
pentatonic:["F","Ab","Bb","C","Eb"],
relative:"Ab major",
mood:"Emotional"
},

"f#major":{
notes:["F#","G#","A#","B","C#","D#","E#"],
chords:["F#","G#m","A#m","B","C#","D#m","E#dim"],
pentatonic:["F#","G#","A#","C#","D#"],
relative:"D# minor",
mood:"Strong"
},

"f#minor":{
notes:["F#","G#","A","B","C#","D","E"],
chords:["F#m","G#dim","A","Bm","C#m","D","E"],
pentatonic:["F#","A","B","C#","E"],
relative:"A major",
mood:"Modern"
},

"gmajor":{
notes:["G","A","B","C","D","E","F#"],

},

"g#minor":{

},

"amajor":{

chords:["A","Bm","C#m","D","E","F#m","G#dim"],

relative:"F# minor",
mood:"Joyful"
},

"aminor":{
notes:["A","B","C","D","E","F","G"],
chords:["Am","Bdim","C","Dm","Em","F","G"],
pentatonic:["A","C","D","E","G"],

mood:"Sad / Emotional"
},

"a#major":{

chords:["A#","Cm","Dm","D#","F","Gm","Adim"],

relative:"G minor",

},

"a#minor":{

"abmajor":{

"bmajor":{

chords:["B","C#m","D#m","E","F#","G#m","A#dim"],

relative:"G# minor",

"bminor":{
notes:["B","C#","D","E","F#","G","A"],
chords:["Bm","C#dim","D","Em","F#m","G","A"],
pentatonic:["B","D","E","F#","A"],
relative:"D major",
mood:"Reflective"
},

"bbmajor":{
notes:["Bb","C","D","Eb","F","G","A"],
chords:["Bb","Cm","Dm","Eb","F","Gm","Adim"],
pentatonic:["Bb","C","D","F","G"],
relative:"G minor",
mood:"Smooth"
},

"bbminor":{
notes:["Bb","C","Db","Eb","F","Gb","Ab"],
chords:["Bbm","Cdim","Db","Ebm","Fm","Gb","Ab"],
pentatonic:["Bb","Db","Eb","F","Ab"],
relative:"Db major",
mood:"Sad"
},

"dbmajor":{
notes:["Db","Eb","F","Gb","Ab","Bb","C"],
chords:["Db","Ebm","Fm","Gb","Ab","Bbm","Cdim"],
pentatonic:["Db","Eb","F","Ab","Bb"],
relative:"Bb minor",
mood:"Calm"
},

"dbminor":{
notes:["Db","Eb","Fb","Gb","Ab","Bbb","Cb"],
chords:["Dbm","Ebdim","Fb","Gbm","Abm","Bbb","Cb"],
pentatonic:["Db","Fb","Gb","Ab","Cb"],
relative:"Fb major",
mood:"Atmospheric"
},

"gbmajor":{
notes:["Gb","Ab","Bb","Cb","Db","Eb","F"],
chords:["Gb","Abm","Bbm","Cb","Db","Ebm","Fdim"],
pentatonic:["Gb","Ab","Bb","Db","Eb"],
relative:"Eb minor",
mood:"Soft"
}

};

function createCards(arr){
  return arr.map(item => `
    <div class="card">${item}</div>
  `).join("");
}

function showScale(){

  const input = normalize(
    document.getElementById("scaleInput").value
  );

  const result = document.getElementById("result");
  const scaleType = document.getElementById("scaleType");

  if(scales[input]){

    const data = scales[input];

    scaleType.innerHTML =
      `🎵 ${input.toUpperCase()}`;

    result.innerHTML = `

      <div class="info">

        <div class="info-card">
          <span>Relative Scale</span><br>
          ${data.relative}
        </div>

        <div class="info-card">
          <span>Mood</span><br>
          ${data.mood}
        </div>

      </div>

      <div class="section">
        <h2>🎼 Scale Notes</h2>

        <div class="grid">
          ${createCards(data.notes)}
        </div>
      </div>

      <div class="section">
        <h2>🎹 Chords in Scale</h2>

        <div class="grid">
          ${createCards(data.chords)}
        </div>
      </div>

      <div class="section">
        <h2>🔥 Pentatonic Scale</h2>

        <div class="grid">
          ${createCards(data.pentatonic)}
        </div>
      </div>

    `;

  } else {

    scaleType.innerHTML = "❌ Not Found";

    result.innerHTML = `
      <div class="error">
        Scale not found.<br><br>

        Try:<br>
        E major<br>
        Bb minor<br>
        F# major<br>
        Ab major
      </div>
    `;
  }
}

function randomScale(){

  const keys = Object.keys(scales);

  const random =
    keys[Math.floor(Math.random()*keys.length)];

  document.getElementById("scaleInput").value =
    random.replace("major"," major")
          .replace("minor"," minor");

  showScale();
}

</script>

</body>
</html>
